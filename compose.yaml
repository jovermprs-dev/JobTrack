# JobTrack: frontend (nginx) + backend (Spring Boot) + PostgreSQL.
# Uso: cp .env.example .env && docker compose up -d --build   →  http://localhost:8080
name: jobtrack

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobtrack}
      POSTGRES_USER: ${POSTGRES_USER:-jobtrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env (copia .env.example)}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # Solo en loopback: para ejecutar el backend fuera de Docker durante el desarrollo.
      - "127.0.0.1:${DB_HOST_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JOBTRACK_DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-jobtrack}
      JOBTRACK_DB_USER: ${POSTGRES_USER:-jobtrack}
      JOBTRACK_DB_PASSWORD: ${POSTGRES_PASSWORD}
      # En local (http) debe ser false; tras HTTPS en un servidor, true (ver docs/deployment.md).
      JOBTRACK_SECURE_COOKIES: ${JOBTRACK_SECURE_COOKIES:-false}
    expose:
      - "8080"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${JOBTRACK_HTTP_PORT:-8080}:8080"

volumes:
  db-data:
