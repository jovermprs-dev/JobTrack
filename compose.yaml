# JobTrack: frontend (nginx) + backend (Spring Boot) + PostgreSQL.
# Uso: cp .env.example .env && docker compose up -d --build   →  http://localhost:8080
name: jobtrack

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobtrack}
      POSTGRES_USER: ${POSTGRES_USER:-jobtrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env (copia .env.example)}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # Solo en loopback: para ejecutar el backend fuera de Docker durante el desarrollo.
      - "127.0.0.1:${DB_HOST_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JOBTRACK_DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-jobtrack}
      JOBTRACK_DB_USER: ${POSTGRES_USER:-jobtrack}
      JOBTRACK_DB_PASSWORD: ${POSTGRES_PASSWORD}
      # Seguro por defecto (true). .env.example lo pone a false para uso local por http; ver docs/deployment.md.
      JOBTRACK_SECURE_COOKIES: ${JOBTRACK_SECURE_COOKIES:-true}
      # true = instancia pública de solo lectura (sin login ni registro, datos de ejemplo). Ver docs/security-and-config.md.
      JOBTRACK_DEMO_MODE: ${JOBTRACK_DEMO_MODE:-false}
    expose:
      - "8080"
    networks:
      default:
        aliases:
          # Nombre propio: si el frontend comparte red con otros proyectos (Traefik), «backend» podría
          # resolver al contenedor de otro proyecto. nginx.conf usa este alias.
          - jobtrack-backend

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${JOBTRACK_BIND:-0.0.0.0}:${JOBTRACK_HTTP_PORT:-8080}:8080"

volumes:
  db-data:
