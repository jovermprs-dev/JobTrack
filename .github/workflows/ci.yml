name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (compilar + pruebas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Las pruebas de integración usan Testcontainers (PostgreSQL 16 real); ubuntu-latest incluye Docker.
      - name: mvn verify
        working-directory: backend
        run: ./mvnw -B verify

  frontend:
    name: Frontend (pruebas + build + auditoría)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test -- --watch=false
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Auditoría de dependencias de producción
        run: npm audit --omit=dev --audit-level=high
        working-directory: frontend

  e2e:
    name: E2E (Docker Compose + Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Configurar entorno con secreto aleatorio
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 24)/" .env
      - name: Levantar el stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Recorridos E2E
        run: npm test
        working-directory: e2e
      - name: Logs del stack si falla
        if: failure()
        run: docker compose logs --no-color --tail=200

  secrets:
    name: Escaneo de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
